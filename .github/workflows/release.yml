name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('scripts/bootstrap.ps1') }}
      - name: Install FFmpeg and Inno Setup
        run: |
          choco install innosetup --no-progress -y
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-essentials.zip'
          $checksumFile = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-essentials.zip.sha256'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $archive
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256' -OutFile $checksumFile
          $expected = (Get-Content $checksumFile -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'FFmpeg archive SHA256 mismatch.' }
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive $archive $extract -Force
          $ffmpegDir = (Get-ChildItem $extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1).DirectoryName
          if (!(Test-Path (Join-Path $ffmpegDir 'ffprobe.exe'))) { throw 'ffprobe.exe missing from FFmpeg package.' }
          Add-Content $env:GITHUB_PATH $ffmpegDir
      - name: Bootstrap
        run: ./scripts/bootstrap.ps1
      - name: Build
        run: ./scripts/build.ps1
      - name: Package
        run: ./scripts/package.ps1
      - name: Unit tests
        run: ./scripts/test.ps1
      - name: Software fallback integration tests
        run: |
          $package = (Resolve-Path dist/ClipForge).Path
          $qt = (Resolve-Path .deps/Qt/6.8.3/msvc2022_64/bin).Path
          $obs = (Resolve-Path "$package/obs/bin/64bit").Path
          $env:CLIPFORGE_TEST_PACKAGE = $package
          $env:PATH = "$package;$qt;$obs;$env:PATH"
          ./build/fallback_tests.exe
      - name: Checksums
        working-directory: dist
        run: |
          Get-FileHash ClipForge-Setup-x64.exe, ClipForge-Windows-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows
          path: |
            dist/ClipForge-Setup-x64.exe
            dist/ClipForge-Windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/ClipForge-Setup-x64.exe dist/ClipForge-Windows-x64.zip dist/SHA256SUMS.txt `
            --title "ClipForge ${{ github.ref_name }}" --generate-notes
